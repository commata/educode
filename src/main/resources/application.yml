spring:
  datasource:
    url: jdbc:mysql://localhost:3306/educode?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:9729}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug

app:
  jwt:
    secret: ${JWT_SECRET:ZmFrZWZha2VmYWtlZmFrZWZha2VmYWtlZmFrZWZha2VmYWtlZmFrZQ==}
    access-token-expiry-seconds: 86400
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:5173
      - http://127.0.0.1:5173
  judge0:
    base-url: ${JUDGE0_BASE_URL:http://localhost:2358}
    x-auth-token: ${JUDGE0_X_AUTH_TOKEN:}
    x-auth-user: ${JUDGE0_X_AUTH_USER:}
    poll-interval-millis: 1000
    max-poll-count: 15
    default-run-time-limit: 2000
    default-run-memory-limit: 256000
    language-map:
      c: 50
      cpp: 54
      java: 62
      python: 71

springdoc:
  swagger-ui:
    path: /swagger-ui.html
